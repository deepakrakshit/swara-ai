<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swara.ai — Sovereign Industrial Workbench</title>
    <meta name="description" content="Swara.ai Sovereign engineering AI workbench operating 100% on-premise for industrial operations (SIH26117)." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23388bfd' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>" />
    <style>
      /* Fallback background during load */
      html, body {
        background-color: #0a0d12;
        color: #e6edf3;
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      /* Custom dark scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(13, 17, 23, 0.5);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(45, 55, 72, 0.8);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(74, 85, 104, 1);
      }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('swara_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.backgroundColor = '#faf9f5';
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#131316';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-workbench-bg text-workbench-text antialiased selection:bg-workbench-accent/30 selection:text-workbench-text overflow-hidden">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
